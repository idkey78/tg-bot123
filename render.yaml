# Render Blueprint: New + → Blueprint → оберіть репозиторій з цим файлом.
services:
  - type: web
    name: order-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot.main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: TIMEZONE
        value: Europe/Kyiv
      # Ці три значення задаються у панелі Render (вони секретні):
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: DATABASE_URL
        sync: false
